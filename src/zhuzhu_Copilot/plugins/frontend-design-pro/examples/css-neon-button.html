<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Button Demo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            margin: 0;
        }
        
        .neon-button {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00f3ff;
            color: #00f3ff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            box-shadow: 0 0 10px #00f3ff, inset 0 0 10px #00f3ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .neon-button:hover {
            background: #00f3ff;
            color: #0a0a0a;
            box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff, inset 0 0 20px #00f3ff;
            transform: scale(1.05);
        }
        
        .neon-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        
        .neon-button:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>
    <button class="neon-button">Hover Me</button>
</body>
</html>
