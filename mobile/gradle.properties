org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Android Studio 同步时会尝试从 services.gradle.org / GitHub 下载 Gradle 源码包，
# 这两个地址在国内经常超时。关闭该行为，源码阅读由 IDE 反编译提供。
systemProp.idea.gradle.download.sources=false
# 该地址不可达时快速失败，避免每次同步卡十几分钟（仅影响源码包下载，不影响依赖）
systemProp.org.gradle.internal.http.connectionTimeout=3000
systemProp.org.gradle.internal.http.socketTimeout=3000
systemProp.org.gradle.internal.repository.max.tentatives=1
