<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 事件流 UI 风格演示 v3</title>
<style>
/* ============================================================
   主题变量：极简浅色 light / 纸感线框 paper / 深色质感 dark
            / 玻璃拟态 glass / 终端工程 terminal
   颜色约束：纯黑 #0A0D12、深蓝 #16305C、淡灰 #EEF0F3、白 #FFFFFF
   ============================================================ */
:root{
  --font-ui: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Cascadia Code", Consolas, "Courier New", monospace;
}
body[data-theme="light"]{
  --bg: #F3F5F8;
  --bg-glow: #FFFFFF;
  --card: #FFFFFF;
  --card-border: #E3E7EE;
  --card-shadow: 0 1px 2px rgba(20,34,60,.04), 0 8px 24px rgba(20,34,60,.06);
  --icon-shell: #EDF0F5;
  --icon-color: #1B3A5C;
  --tag-bg: #EDF0F5;
  --tag-fg: #3A4653;
  --title-fg: #141B26;
  --body-fg: #4E5B6C;
  --accent: #1B3A5C;
  --accent-soft: rgba(27,58,92,.12);
  --line: #E3E7EE;
  --dash: #C3CCD9;
  --user-bg: #1B3A5C;
  --user-fg: #FFFFFF;
  --cmd-fg: #243040;
  --ok-fg: #1B4A8A;
  --muted: #8A94A6;
}
body[data-theme="paper"]{
  --bg: #FAFBFC;
  --bg-glow: #FFFFFF;
  --card: #FFFFFF;
  --card-border: #E6E9EF;
  --card-shadow: none;
  --icon-shell: #F2F4F8;
  --icon-color: #16305C;
  --tag-bg: #F2F4F8;
  --tag-fg: #59657A;
  --title-fg: #101725;
  --body-fg: #4A5568;
  --accent: #16305C;
  --accent-soft: rgba(22,48,92,.08);
  --line: #E6E9EF;
  --dash: #C9D2DE;
  --user-bg: #16305C;
  --user-fg: #FFFFFF;
  --cmd-fg: #1F2937;
  --ok-fg: #16305C;
  --muted: #8A94A6;
}
body[data-theme="dark"]{
  --bg: #0A0D12;
  --bg-glow: #13203A;
  --card: #0D1526;
  --card-border: #22334F;
  --card-shadow: 0 1px 0 rgba(146,184,255,.10) inset, 0 10px 32px rgba(0,0,0,.55);
  --icon-shell: #13203A;
  --icon-color: #7FB0FF;
  --tag-bg: rgba(38,76,140,.32);
  --tag-fg: #9CC0FF;
  --title-fg: #E8EEF8;
  --body-fg: #94A6C2;
  --accent: #7FB0FF;
  --accent-soft: rgba(90,150,255,.16);
  --line: #22334F;
  --dash: #2A3D61;
  --user-bg: #1B4A8A;
  --user-fg: #FFFFFF;
  --cmd-fg: #D9E6FA;
  --ok-fg: #7FB0FF;
  --muted: #6E87AD;
}
body[data-theme="glass"]{
  --bg: #070A12;
  --bg-glow: #16263F;
  --card: rgba(19,32,58,.55);
  --card-border: rgba(127,176,255,.18);
  --card-shadow: 0 8px 30px rgba(0,0,0,.45);
  --icon-shell: rgba(38,64,106,.55);
  --icon-color: #8FB8FF;
  --tag-bg: rgba(38,76,140,.42);
  --tag-fg: #A6C4FF;
  --title-fg: #EDF2FB;
  --body-fg: #A9B8D2;
  --accent: #8FB8FF;
  --accent-soft: rgba(111,168,255,.22);
  --line: rgba(127,176,255,.16);
  --dash: rgba(127,176,255,.30);
  --user-bg: #1B4A8A;
  --user-fg: #FFFFFF;
  --cmd-fg: #DFEAFF;
  --ok-fg: #8FB8FF;
  --muted: #7D93B8;
  --glass-blur: 18px;
}
body[data-theme="terminal"]{
  --bg: #0A0B0F;
  --bg-glow: #0F1626;
  --card: #0E131C;
  --card-border: #1D2633;
  --card-shadow: 0 0 0 1px rgba(120,160,255,.05) inset;
  --icon-shell: #111826;
  --icon-color: #8CB4FF;
  --tag-bg: transparent;
  --tag-fg: #6E87AD;
  --title-fg: #D7E2F2;
  --body-fg: #8A9AB5;
  --accent: #8CB4FF;
  --accent-soft: rgba(90,150,255,.10);
  --line: #1D2633;
  --dash: #2A3444;
  --user-bg: #13203A;
  --user-fg: #C9D9F5;
  --cmd-fg: #E3EDFF;
  --ok-fg: #8CB4FF;
  --muted: #5E7390;
}
*{ box-sizing: border-box; margin: 0; padding: 0; }
html,body{ height: 100%; }
body{
  font-family: var(--font-ui);
  background: radial-gradient(1200px 620px at 50% -8%, var(--bg-glow) 0%, transparent 62%), var(--bg);
  color: var(--body-fg);
  background-attachment: fixed;
  transition: background-color .5s ease;
}

.wrap{
  width: min(760px, 94vw);
  margin: 0 auto;
  padding: 46px 0 80px;
}
/* ---------- 顶栏 ---------- */
.topbar{
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 14px; margin-bottom: 30px;
}
.brand{ display: flex; align-items: center; gap: 12px; }
.brand .mark{
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  background: var(--icon-shell);
  color: var(--icon-color);
  box-shadow: 0 0 0 1px var(--card-border) inset;
}
.brand h1{ font-size: 15px; font-weight: 600; color: var(--title-fg); letter-spacing: .2px; }
.brand p{ font-size: 12px; color: var(--body-fg); margin-top: 2px; }

.switcher{
  display: flex; gap: 4px; padding: 4px; flex-wrap: wrap;
  background: var(--icon-shell);
  border: 1px solid var(--card-border);
  border-radius: 999px;
}
.switcher button{
  appearance: none; border: 0; cursor: pointer;
  font-family: var(--font-ui); font-size: 12.5px;
  padding: 7px 16px; border-radius: 999px;
  background: transparent; color: var(--body-fg);
  transition: all .25s ease;
}
.switcher button.active{
  background: var(--card);
  color: var(--accent);
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
  font-weight: 600;
}

/* ---------- 对话线程 ---------- */
.thread{ }
.turn{ opacity: 0; }
.thread.play .turn{ animation: rise .5s cubic-bezier(.2,.7,.3,1) both; }
.thread.play .n1{ animation-delay: .08s; }
.thread.play .n2{ animation-delay: .20s; }
.thread.play .n3{ animation-delay: .32s; }
.thread.play .n4{ animation-delay: .44s; }
@keyframes rise{
  from{ opacity: 0; transform: translateY(14px); }
  to{ opacity: 1; transform: translateY(0); }
}
/* 事件块入场（工具/命令依次出现） */
.rise-in{ animation: rise .42s cubic-bezier(.2,.7,.3,1) both; }
.fade-in{ animation: fade .38s ease both; }
@keyframes fade{ from{ opacity: 0; } to{ opacity: 1; } }
/* 尚未轮到的事件块先隐藏，避免结果提前出现 */
.queued{ display: none !important; }

/* ============================================================
   用户消息（气泡）
   ============================================================ */
.user-turn{ display: flex; justify-content: flex-end; margin: 8px 0 12px; }
.msg{
  background: var(--user-bg);
  color: var(--user-fg);
  border-radius: 18px 18px 6px 18px;
  padding: 12px 17px;
  font-size: 13.5px; line-height: 1.65;
  max-width: 84%;
  box-shadow: var(--card-shadow);
}
.msg .meta{ display: block; margin-top: 5px; font-size: 10.5px; opacity: .55; }

/* ============================================================
   AI 回合：无气泡，虚线隔离分区
   ============================================================ */
.ai-turn{
  position: relative;
  margin: 0 0 22px;
  padding: 14px 0 4px;
  border-top: 1px dashed var(--dash);
  border-bottom: 1px dashed var(--dash);
}
.ai-turn .vline{ /* 左侧垂直虚线，强化分区感 */
  position: absolute; left: -14px; top: 14px; bottom: 6px;
  width: 1px;
  background-image: linear-gradient(var(--dash) 50%, transparent 50%);
  background-size: 1px 8px;
}

/* 左上角耗时徽章 */
.cost-ribbon{
  position: absolute; left: 0; top: -12px;
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; font-weight: 600;
  color: var(--accent);
  background: var(--card);
  border: 1px solid var(--card-border);
  padding: 4px 12px 4px 8px;
  border-radius: 999px;
  box-shadow: var(--card-shadow);
}
.cost-ribbon svg{ width: 13px; height: 13px; }
.sys-meta{
  margin: 8px 0 10px;
  font-size: 11px; color: var(--muted);
  font-family: var(--font-mono);
}
.sys-meta b{ color: var(--accent); font-weight: 600; }

/* ---------- 思考过程（气泡形式） ---------- */
.think-bubble{
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 6px 16px 16px 16px;
  box-shadow: var(--card-shadow);
  padding: 12px 15px;
  margin-bottom: 12px;
  position: relative;
  backdrop-filter: blur(var(--glass-blur, 0));
  -webkit-backdrop-filter: blur(var(--glass-blur, 0));
}
.tb-head{ display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.tb-head .icon{
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--icon-shell); color: var(--icon-color);
}
.tb-head .icon svg{ width: 15px; height: 15px; }
.tb-head strong{ font-size: 12.5px; color: var(--title-fg); font-weight: 600; }
.tb-head .tag{ margin-left: auto; }
.tag{
  font-size: 10.5px; line-height: 1;
  padding: 4px 9px; border-radius: 999px;
  background: var(--tag-bg); color: var(--tag-fg);
  white-space: nowrap;
}
.think-bubble .think-txt{
  font-size: 12.5px; line-height: 1.75; color: var(--body-fg);
  white-space: pre-wrap; word-break: break-word;
  /* 默认高度完全自适应，不预留任何空白 */
  max-height: none;
  transition: max-height .45s cubic-bezier(.2,.7,.3,1);
}
.think-bubble .dots{ display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 1px; }
.dots i{
  width: 4px; height: 4px; border-radius: 50%;
  background: currentColor; opacity: .5;
  animation: dot 1.2s ease-in-out infinite;
}
.dots i:nth-child(2){ animation-delay: .15s; }
.dots i:nth-child(3){ animation-delay: .3s; }
@keyframes dot{ 0%,80%,100%{ transform: translateY(0);} 40%{ transform: translateY(-3px);} }
/* 思考结束：标签圆点停止并隐藏 */
.think-bubble.think-done .dots{ display: none; }

/* ============================================================
   思考折叠：只有正文严格超过 5 行时，JS 才加 .folded 封顶 5 行；
   ≤5 行的短气泡永远保持内容高度（高度自适应），不预留 5 行空白。
   ============================================================ */
.tb-body{ overflow: hidden; }
.think-bubble.folded .think-txt{
  max-height: calc(5 * 1.75em);
  overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 62%, transparent 98%);
  mask-image: linear-gradient(#000 62%, transparent 98%);
}
.think-bubble.folded.open .think-txt{ max-height: 900px; -webkit-mask-image: none; mask-image: none; }

.fold-ctrl{ margin-top: 8px; text-align: center; }
.fold-btn{
  appearance: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 12px; font-weight: 600;
  color: var(--accent);
  background: transparent;
  border: 1px dashed var(--dash);
  border-radius: 999px;
  padding: 7px 20px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .2s ease;
}
.fold-btn:hover{ background: var(--accent-soft); border-style: solid; }
.fold-btn svg{ width: 13px; height: 13px; transition: transform .3s ease; }
.fold-btn.open svg{ transform: rotate(180deg); }

/* ---------- 过程区：完成汇报后整体收起，点击按钮展开/收起 ---------- */
.ai-proc{
  overflow: hidden;
  max-height: 1200px;
  transition: max-height .55s cubic-bezier(.2,.7,.3,1), opacity .4s ease, margin .55s ease;
  margin-bottom: 2px;
}
.ai-turn.done .ai-proc{
  max-height: 0; opacity: 0; margin-bottom: 0; pointer-events: none;
}
.proc-ctrl{ margin: 2px 0 10px; }
.proc-btn{
  appearance: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 11.5px; font-weight: 600;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--card-border);
  border-radius: 999px;
  padding: 5px 13px;
  display: inline-flex; align-items: center; gap: 5px;
  transition: all .2s ease;
}
.proc-btn:hover{ background: var(--accent-soft); }
.proc-btn svg{ width: 12px; height: 12px; transition: transform .3s ease; transform: rotate(-90deg); }
.ai-turn.done .proc-btn svg{ transform: rotate(90deg); }

/* ---------- 工具调用 / 执行命令（无气泡，行内条目） ---------- */
.tool-call{
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 2px; margin-bottom: 10px;
}
.tc-icon{
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--icon-shell); color: var(--icon-color);
  box-shadow: 0 0 0 1px var(--card-border) inset;
}
.tc-icon svg{ width: 16px; height: 16px; }
.tc-body{ min-width: 0; }
.tc-title{ font-size: 12.5px; font-weight: 600; color: var(--title-fg); font-family: var(--font-mono); }
.tc-meta{ font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--font-mono); }
.kv{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.kv em{
  font-style: normal; font-size: 11px;
  padding: 4px 10px; border-radius: 7px;
  background: var(--tag-bg); color: var(--tag-fg);
  font-family: var(--font-mono);
}
.kv em b{ font-weight: 600; color: var(--title-fg); margin-right: 5px; }

.cmd{
  margin-bottom: 12px; border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--card-border) 45%, transparent);
  backdrop-filter: blur(var(--glass-blur, 0));
  -webkit-backdrop-filter: blur(var(--glass-blur, 0));
}
.cmd .bar{
  font-family: var(--font-mono); font-size: 11px;
  padding: 7px 12px;
  color: var(--body-fg);
  border-bottom: 1px solid var(--line);
  display: flex; gap: 12px; align-items: center;
}
.cmd .bar .dotbtn{ width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.cmd .in{ font-family: var(--font-mono); font-size: 12.5px; color: var(--cmd-fg); padding: 10px 13px; }
.cmd .in .dol{ color: var(--accent); }
.cmd .in .typing{ white-space: pre-wrap; word-break: break-word; }
.cmd .out{
  font-family: var(--font-mono); font-size: 11.5px; color: var(--ok-fg);
  padding: 0 13px 10px;
}
.cmd .out::before{ content: "ok  "; opacity: .55; font-weight: 700; }

/* ============================================================
   正文回复区：永不收起，完整展示
   ============================================================ */
.stream{ margin-bottom: 10px; }
.stream .txt{
  font-size: 13.5px; line-height: 1.8; color: var(--body-fg);
  white-space: pre-wrap; word-break: break-word;
}
/* 打字光标：内联伪元素，紧跟最后一个字符，绝不另起空行；
   仅在 .typing（流式输出中）显示，完成后自动淡出。 */
.stream .txt::after{
  content: "";
  display: inline-block; width: 7px; height: 15px;
  vertical-align: text-bottom; margin-left: 2px;
  border-radius: 1px;
  background: var(--accent);
  opacity: 0;
  animation: blink 1s steps(1) infinite;
  transition: opacity .25s ease;
}
.stream.typing .txt::after{ opacity: 1; }
@keyframes blink{ 50%{ opacity: 0; } }

/* ---------- 操作区 ---------- */
.actions{ margin-top: 26px; text-align: center; }
.btn{
  appearance: none; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  padding: 10px 22px; border-radius: 999px;
  border: 1px solid var(--card-border);
  background: var(--accent); color: #fff;
  box-shadow: 0 6px 18px var(--accent-soft);
  transition: transform .18s ease, box-shadow .18s ease;
}
.btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 24px var(--accent-soft); }
.hint{
  margin-top: 14px; font-size: 11.5px; color: var(--body-fg); opacity: .8;
  font-family: var(--font-mono);
}

/* ---------- 终端风特殊化 ---------- */
body[data-theme="terminal"] .tag{ font-family: var(--font-mono); background: none; padding: 0; }
body[data-theme="terminal"] .think-bubble{ border-radius: 4px; }
body[data-theme="terminal"] .msg{ border-radius: 4px; font-family: var(--font-mono); font-size: 12.5px; }
body[data-theme="terminal"] .brand h1,
body[data-theme="terminal"] .tb-head strong,
body[data-theme="terminal"] .stream .txt,
body[data-theme="terminal"] .sys-meta{ font-family: var(--font-mono); }
body[data-theme="terminal"] .switcher,
body[data-theme="terminal"] .btn{ border-radius: 6px; font-family: var(--font-mono); }
body[data-theme="terminal"] .fold-btn{ font-family: var(--font-mono); border-radius: 6px; }
body[data-theme="terminal"] .kv em{ border-radius: 4px; }
/* 玻璃风特殊化 */
body[data-theme="glass"] .think-bubble,
body[data-theme="glass"] .cmd{ backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
</style>
</head>
<body data-theme="glass">

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="mark" id="brandMark"></div>
      <div>
        <h1>AI 事件流 UI 风格演示 v3</h1>
      </div>
    </div>
    <nav class="switcher" id="switcher">
      <button data-theme="light">极简浅色</button>
      <button data-theme="paper">纸感线框</button>
      <button data-theme="dark">深色质感</button>
      <button data-theme="glass" class="active">玻璃拟态</button>
      <button data-theme="terminal">终端工程</button>
    </nav>
  </header>

  <main class="thread play" id="thread"></main>

  <div class="actions">
    <button class="btn" id="replay">重播动效</button>
    <p class="hint" id="hint"></p>
  </div>
</div>

<script>
/* ============================================================
   数据层：对话线程样例（与客户端约定的事件模型）
   { kind: 'user'|'ai',  text?, items?, cost?, time? }
   ai.items: [{ type:'think'|'tool'|'exec'|'stream', ... }]
   ============================================================ */
const DEMO_THREAD = [
  {
    kind: "user",
    text: "扫描 D 盘全部软件安装包，识别其中需要迁移到新电脑的应用，并生成迁移清单。",
    time: "14:02:31"
  },
  {
    kind: "ai",
    cost: "12.4s",
    time: "14:02:31 → 14:02:43",
    items: [
      {
        type: "think",
        tag: "PLANNING",
        text: "用户要求扫描全盘部署包并生成迁移清单：先枚举 D 盘全部安装产物，再调用 yara 规则库过滤已知软件指纹，随后对未命中项做启发式分析，最后按迁移风险分层汇总输出。\n候选策略有两套：一是全盘静态扫描，覆盖完整但耗时较长；二是基于注册表痕迹与安装目录命名的快速索引，效率高但对免安装程序存在漏检可能。结合用户生成可执行迁移清单的目标，选择全盘静态扫描作为主策略，并保留增量索引作为二次校验。\n执行顺序依次为：环境预检、规则库加载、全盘扫描、指纹匹配、风险分层、清单导出，共六个阶段，预计耗时与扫描体积成正比。\n同时需校验规则库版本与 D 盘目录结构，若存在锁定文件或权限异常，将自动降级为只读扫描并输出告警，确保流程可观测、可回退。"
      },
      {
        type: "tool",
        name: "scan_drives",
        meta: "target=D:/ · recursive",
        params: { rule: "yara 38", driver: "D", mode: "full" }
      },
      {
        type: "exec",
        cmd: "python -m migrator scan --drive D --rules config/yara --out builds_index.json",
        out: "indexed 214 packages · 42 APP matches"
      },
      {
        type: "stream",

      }
    ]
  },
  {
    kind: "user",

  },
  {
    kind: "ai",
    cost: "3.1s",
    time: "14:03:05 → 14:03:09",
    items: [
      {
        type: "think",
        tag: "EXEC",
        text: "用户只要开发工具类清单，直接启用增量导出，跳过其余分类。"
      },
      {
        type: "exec",
        cmd: "python -m migrator export --class dev --format csv --out devtools.csv",
        out: "exported 14 rows · devtools.csv"
      },
      {
        type: "stream",
        text: "开发工具类清单已导出为 devtools.csv，共 14 项，已按迁移风险降序排列，可直接用于批量部署。"
      }
    ]
  }
];

/* ============================================================
   视图层：矢量图标（stroke 线性，24x24 viewBox）
   ============================================================ */
const ICONS = {
  clock:  '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  think:  '<path d="M15 14c.2-1 .7-1.7 1.5-2.5C17.6 10.5 18 9.3 18 8c0-3.3-2.7-6-6-6S6 4.7 6 8c0 1.3.4 2.5 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
  tool:   '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  exec:   '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
  down:   '<polyline points="6 9 12 15 18 9"/>',
  nav:    '<polyline points="9 6 15 12 9 18"/>'
};
const iconSvg = (name, w) =>
  `<svg width="${w||16}" height="${w||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

/* ============================================================
   流式引擎：requestAnimationFrame 驱动，按恒定“字符/秒”速率
   逐帧推进，与屏幕刷新同步，丝滑连贯；掉帧时按时间补偿，
   不会因帧率波动而忽快忽慢。
   ============================================================ */
const CANCEL = { cancelled: true };
let playGen = 0;                 /* 播放代次：重播/重挂载时自增，旧播放链自动失效 */

function rafStream(el, text, cps, gen) {
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    el.textContent = "";
    const frame = (now) => {
      if (gen !== playGen) return reject(CANCEL);
      const n = Math.min(text.length, Math.max(0, Math.floor((now - t0) / 1000 * cps)));
      el.textContent = text.slice(0, n);
      scrollTick();
      if (n >= text.length) { el.textContent = text; resolve(); }
      else requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}
const wait = (ms, gen) => new Promise((resolve, reject) => {
  setTimeout(() => (gen === playGen ? resolve() : reject(CANCEL)), ms);
});

/* ---------- 跟随滚动：用户在底部时自动跟随，手动上翻后不强制拉回 ---------- */
let stickBottom = true;
window.addEventListener("scroll", () => {
  stickBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 140;
});
function scrollTick() {
  if (stickBottom) window.scrollTo(0, document.body.scrollHeight);
}

/* ---------- 回合渲染 ---------- */
const renders = {
  user(t) {
    return `
      <div class="turn user-turn n${t._i}">
        <div class="msg">${t.text}<span class="meta">${t.time}</span></div>
      </div>`;
  },
  ai(t) {
    const cost = `<div class="cost-ribbon">${iconSvg('clock', 13)}${t.cost}</div>`;
    const sys = `<div class="sys-meta">${t.time}</div>`;
    /* 每个事件块带 data-key，播放时按 items 顺序逐个揭示；
       思考/工具/命令在过程区内，正文在过程区外（永不收起）。 */
    const procBlocks = t.items.map((it, i) =>
      it.type !== "stream" && renders[it.type] ? renders[it.type](it, i) : "").join("");
    const bodyBlocks = t.items.map((it, i) =>
      it.type === "stream" ? renders[it.type](it, i) : "").join("");
    return `
      <div class="turn ai-turn n${t._i}">
        <span class="vline"></span>${cost}
        <div class="ai-proc">${procBlocks}</div>
        ${bodyBlocks}${sys}
      </div>`;
  },
  think(it, key) {
    return `
      <div class="think-bubble" data-key="${key}">
        <div class="tb-head">
          <span class="icon">${iconSvg('think')}</span>
          <strong>思考过程</strong>
          <span class="tag">${it.tag}<span class="dots"><i></i><i></i><i></i></span></span>
        </div>
        <div class="tb-body">
          <div class="think-txt"></div>
          <div class="fold-ctrl queued"><button class="fold-btn">继续查看${iconSvg('down', 13)}</button></div>
        </div>
      </div>`;
  },
  tool(it, key) {
    return `
      <div class="tool-call queued" data-key="${key}">
        <span class="tc-icon">${iconSvg('tool')}</span>
        <div class="tc-body">
          <div class="tc-title">${it.name}</div>
          <div class="tc-meta">${it.meta}</div>
          <div class="kv">${Object.entries(it.params||{}).map(([k,v])=>`<em><b>${k}</b>${v}</em>`).join('')}</div>
        </div>
      </div>`;
  },
  exec(it, key) {
    return `
      <div class="cmd queued" data-key="${key}">
        <div class="bar"><span class="dotbtn"></span><span class="dotbtn"></span><span class="dotbtn"></span><span>PowerShell</span></div>
        <div class="in"><span class="dol">$&nbsp;</span><span class="typing"></span></div>
        <div class="out queued">${it.out}</div>
      </div>`;
  },
  stream(it, key) {
    return `
      <div class="stream" data-key="${key}">
        <div class="txt"></div>
      </div>`;
  }
};

/* ---------- 挂载 ---------- */
const thread = document.getElementById('thread');
function mount() {
  thread.innerHTML = DEMO_THREAD.map((t, i) =>
    renders[t.kind](Object.assign({}, t, { _i: i + 1 }))).join('');
}
mount();

/* ============================================================
   思考折叠装配：严格按“实际行数 > 5”判定
   - >5 行：加 .folded，封顶 5 行 + 展开按钮
   - ≤5 行：绝不加 .folded，气泡保持内容高度（高度自适应）
   ============================================================ */
function makeFoldable(bubble) {
  const txt = bubble.querySelector('.think-txt');
  const ctl = bubble.querySelector('.fold-ctrl');
  const btn = bubble.querySelector('.fold-btn');

  const reflow = () => {
    const lineH = parseFloat(getComputedStyle(txt).lineHeight);
    const over = txt.scrollHeight / lineH > 5.02; /* 容差，避免临界行误判 */
    bubble.classList.toggle('folded', over);
    ctl.classList.toggle('queued', !over);
  };

  if (btn) btn.addEventListener('click', e => {
    e.stopPropagation();
    const expanded = bubble.classList.toggle('open');
    btn.innerHTML = expanded ? `收起${iconSvg('down', 13)}` : `继续查看${iconSvg('down', 13)}`;
    btn.classList.toggle('open', expanded);
  });
  return reflow;
}

/* ---------- 单个事件块的揭示 ---------- */
function reveal(el, animClass) {
  el.classList.remove('queued');
  el.classList.add(animClass || 'rise-in');
}

/* ---------- 单个 AI 回合顺序播放：思考 → 工具/命令 → 正文 ---------- */
async function playTurn(turnEl, data, gen) {
  for (let i = 0; i < data.items.length; i++) {
    if (gen !== playGen) throw CANCEL;
    const it = data.items[i];
    const block = turnEl.querySelector(`[data-key="${i}"]`);

    if (it.type === 'think') {
      const txt = block.querySelector('.think-txt');
      const reflowFold = makeFoldable(block);  /* 对思考气泡本身装配折叠 */
      await rafStream(txt, it.text, 115, gen);   /* 思考快速流出 */
      block.classList.add('think-done');          /* 停止标签圆点 */
      reflowFold();                               /* 按行数决定是否折叠 */
      await wait(160, gen);
    } else if (it.type === 'tool') {
      reveal(block, 'rise-in');
      scrollTick();
      await wait(360, gen);
    } else if (it.type === 'exec') {
      reveal(block, 'rise-in');
      const typing = block.querySelector('.typing');
      const out = block.querySelector('.out');
      await wait(200, gen);
      await rafStream(typing, it.cmd, 260, gen);  /* 命令行快速打出 */
      await wait(180, gen);
      out.classList.remove('queued');
      out.classList.add('fade-in');               /* 输出淡入 */
      scrollTick();
      await wait(300, gen);
    } else if (it.type === 'stream') {
      block.classList.add('typing');
      const txt = block.querySelector('.txt');
      await rafStream(txt, it.text, 78, gen);     /* 正文从容输出 */
      block.classList.remove('typing');           /* 光标淡出 */
    }
  }

  /* 正文输出完成 = AI 正式完成汇报 → 收起过程区，只留正文 */
  wireProcCollapse(turnEl);
}

/* 过程区收起/展开按钮装配：AI 完成后默认收起过程，只留正文 */
function wireProcCollapse(turn) {
  if (turn._collapsed) return;
  turn._collapsed = true;

  const proc = turn.querySelector('.ai-proc');
  if (!proc) return;
  const ctl = document.createElement('div');
  ctl.className = 'proc-ctrl';
  ctl.innerHTML = `<button class="proc-btn">查看执行过程${iconSvg('nav', 12)}</button>`;
  proc.after(ctl);
  turn.classList.add('done');

  const btn = ctl.querySelector('.proc-btn');
  let open = false;
  btn.addEventListener('click', () => {
    open = !open;
    turn.classList.toggle('done', !open);
    btn.innerHTML = open
      ? `收起执行过程${iconSvg('nav', 12)}`
      : `查看执行过程${iconSvg('nav', 12)}`;
  });
}

/* ---------- 整场播放：回合并发改为严格顺序，杜绝时序错乱 ---------- */
async function play() {
  const gen = ++playGen;
  stickBottom = true;
  const aiTurns = [...thread.querySelectorAll('.ai-turn')];
  const aiData = DEMO_THREAD.filter(t => t.kind === 'ai');
  try {
    await wait(260, gen);
    for (let k = 0; k < aiTurns.length; k++) {
      await playTurn(aiTurns[k], aiData[k], gen);
      await wait(300, gen);
    }
  } catch (e) {
    if (e !== CANCEL) throw e; /* 旧播放链被重播取代，静默退出 */
  }
}
play();

/* 窗口尺寸变化：重新判定思考折叠（短内容自动取消折叠，高度自适应） */
let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    thread.querySelectorAll('.think-bubble').forEach(b => {
      const txt = b.querySelector('.think-txt');
      const ctl = b.querySelector('.fold-ctrl');
      const lineH = parseFloat(getComputedStyle(txt).lineHeight);
      const over = txt.scrollHeight / lineH > 5.02;
      if (!over) { b.classList.remove('folded', 'open'); ctl.classList.add('queued'); }
    });
  }, 180);
});

/* ---------- 交互 ---------- */
const replay = document.getElementById('replay');
const restart = () => {
  mount();                       /* 重建 DOM，所有状态归零 */
  thread.classList.remove('play');
  void thread.offsetWidth;
  thread.classList.add('play');
  play();                        /* 旧播放链因 playGen 自增自动取消 */
};
replay.addEventListener('click', restart);

const switcher = document.getElementById('switcher');
switcher.addEventListener('click', ev => {
  const btn = ev.target.closest('button');
  if (!btn) return;
  document.body.dataset.theme = btn.dataset.theme;
  switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
});

document.getElementById('brandMark').innerHTML = iconSvg('think', 20);

/* 页面自检：核心节点与渲染完整性 */
const selfCheck = () => {
  const checks = [
    thread.querySelectorAll('.stream').length === 2,
    thread.querySelectorAll('.think-bubble').length === 2,
    thread.querySelectorAll('.ai-proc').length === 2,
    thread.querySelectorAll('.cost-ribbon').length === 2,
    thread.querySelectorAll('.tool-call, .cmd').length >= 1,
    document.querySelectorAll('.switcher button').length === 5,
    !/["\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(thread.textContent)
  ];
  const pass = checks.every(Boolean);
  const hint = document.getElementById('hint');
  hint.textContent = `SELF-CHECK ${pass ? 'PASS' : 'FAIL'}`;
  hint.style.color = pass ? 'var(--ok-fg)' : 'var(--accent)';
};
selfCheck();
</script>
