# /etc/systemd/system/redis-server.service.d/override.conf
[Service]
# Debian ships /usr/bin/redis-server as a symlink to redis-check-rdb; the packaged
# unit sets NoExecPaths=/ so the resolved target must be whitelisted explicitly.
ExecPaths=/usr/bin/redis-server /usr/bin/redis-check-rdb /usr/bin/redis-check-aof /usr/lib /lib
# BT panel installs jemalloc into /usr/local/lib and it wins via ld.so.conf.
# NoExecPaths=/ denies mmap(PROT_EXEC) on it -> "failed to map segment". Whitelist it.
ExecPaths=/usr/local/lib

LimitNOFILE=65535
OOMScoreAdjust=-500
Restart=always
RestartSec=2
TimeoutStopSec=30
