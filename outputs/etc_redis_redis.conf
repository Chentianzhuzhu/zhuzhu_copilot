#############################################################
# Redis cache node - managed config (FINAL, as deployed)
# target: 122.228.216.138  Debian 12, Redis 7.0.15
# backup of stock config: /etc/redis/redis.conf.bak.20261019-003838
# NOTE: requirepass redacted - see outputs/redis_deployment_report.md
#############################################################

################## NETWORK ##################
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 8192
timeout 0
tcp-keepalive 300

################## GENERAL ##################
daemonize no
supervised systemd
pidfile /run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16
always-show-logo no
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

################## SNAPSHOTTING ##################
# Cache workload: light RDB only, no AOF (max write throughput).
save 900 1
save 300 10
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis
appendonly no

################## MEMORY ##################
# Box has 1.9G RAM shared with MySQL/PHP/panel -> hard cap here.
maxmemory 384mb
maxmemory-policy allkeys-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

################## LATENCY / THROUGHPUT ##################
# 2 vCPU box: keep the main thread single (io-threads>1 needs 4+ cores).
hz 10
dynamic-hz yes
latency-monitor-threshold 100

################## CLIENTS ##################
maxclients 10000

################## SECURITY ##################
requirepass <REDACTED - 见部署报告>
# Data-destruction / debug commands disabled on a shared cache node.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

################## LOGGING ##################
slowlog-log-slower-than 10000
slowlog-max-len 256

################## NOTIFICATIONS ##################
notify-keyspace-events ""

################## CLIENT BUFFER LIMITS ##################
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
