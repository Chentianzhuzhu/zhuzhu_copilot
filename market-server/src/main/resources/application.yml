server:
  port: 8081

spring:
  application:
    name: plugin-market
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/plugin_market?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: marketapp
    password: ${DB_PASSWORD:CHANGE_ME}
    hikari:
      maximum-pool-size: 8
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD:CHANGE_ME}
      database: 2
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB

market:
  storage-dir: /var/lib/plugin-market/files
  max-uploads-per-day: 30
