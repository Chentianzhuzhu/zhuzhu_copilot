<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex, follow">
  <title th:text="${status != null ? status + ' · ' + title : '页面出错'}">页面出错</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!--
    错误页刻意不引用外部样式与脚本：出错时资源本身可能正是不可用的，
    因此这里只用一小段内联样式，保证任何情况下都能正常显示。
    四色体系：纯黑 #000 / 白 #F5F5F5 / 深蓝 #1E40AF（+ 灰阶过渡）。
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #F5F5F5;
      font-family: "Source Han Sans SC", "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .err-wrap { width: min(560px, 90%); }
    .err-mark { width: 34px; height: 34px; margin-bottom: 26px; color: #F5F5F5; }
    .err-code {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 12px; letter-spacing: .32em; color: #5B7BE8;
    }
    .err-title { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; margin: 16px 0 12px; }
    .err-msg { color: rgba(245,245,245,.62); margin-bottom: 28px; }
    .err-actions { display: flex; flex-wrap: wrap; gap: 14px; }
    .err-btn {
      display: inline-flex; align-items: center; gap: .5em;
      padding: 14px 26px; font-size: 14px; letter-spacing: .06em; text-decoration: none;
      clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    }
    .err-btn-primary { background: #1E40AF; color: #fff; }
    .err-btn-ghost { color: #F5F5F5; border: 1px solid rgba(245,245,245,.18); }
  </style>
</head>
<body>

<div class="err-wrap">
  <svg class="err-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect x="1.6" y="1.6" width="20.8" height="20.8" rx="3" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 1.6v20.8M1.6 12h20.8" stroke="currentColor" stroke-width="1" opacity=".38"/>
    <rect x="4.7" y="4.7" width="6" height="6" rx="1.2" fill="#1E40AF"/>
  </svg>
  <p class="err-code" th:text="${status != null ? status : 'ERR'}">ERR</p>
  <h1 class="err-title" th:text="${title != null ? title : '页面暂时无法访问'}">页面暂时无法访问</h1>
  <p class="err-msg" th:text="${message != null and !#strings.isEmpty(message) ? message : '请求的地址不存在或服务暂时不可用。'}">说明</p>
  <div class="err-actions">
    <a class="err-btn err-btn-primary" href="/">返回首页</a>
    <a class="err-btn err-btn-ghost" href="/sitemap.xml">站点地图</a>
  </div>
</div>

</body>
</html>
