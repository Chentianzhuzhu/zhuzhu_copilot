<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body th:attr="data-page=${pagePath}" class="has-mobile-bar">

<a class="skip-link" href="#main">跳到主要内容</a>

<header th:replace="~{fragments/nav :: nav}"></header>

<main id="main">

  <!-- ==================== 主视觉 ==================== -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <p class="eyebrow reveal" style="--d:.05s">
          <span class="pulse-dot" aria-hidden="true"></span>WINDOWS 应用迁移 / AI COPILOT
        </p>
        <p class="hero-slogan" th:text="${site.title}">WinAppMigrator</p>
        <h1 class="hero-title" th:text="${site.slogan}">把电脑交给 AI，替你把活干完</h1>
        <p class="hero-desc reveal" style="--d:.4s" th:text="${site.description}">产品描述</p>
        <div class="hero-actions reveal" style="--d:.52s">
          <a class="btn btn-primary" id="downloadBtn"
             th:href="${latest != null ? latest.url : '/download'}">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>
            </svg>
            <span th:text="${'下载 ' + site.title}">下载</span>
          </a>
          <a class="btn btn-ghost" href="#features">浏览功能特性</a>
        </div>
        <p class="hero-version reveal" id="versionLine" style="--d:.64s">
          <span th:if="${latest != null}">
            最新版本 <a class="v-link" href="#changelog" th:text="${'v' + latest.version}">v1.0.0</a>
            <span class="v-sep" th:if="${!#strings.isEmpty(latest.sizeText)}">/</span>
            <span th:if="${!#strings.isEmpty(latest.sizeText)}" th:text="${latest.sizeText}">1.0 MB</span>
            <span class="v-sep">/</span><span id="dlInline" th:text="${downloadsText}">0</span> 次下载
          </span>
          <span th:unless="${latest != null}">版本信息暂不可用</span>
        </p>
      </div>

      <!-- 没有后台主图时使用内容索引，不伪造产品界面或运行状态。 -->
      <div class="hero-visual" id="heroVisual">
        <figure class="hero-shot" th:if="${!#strings.isEmpty(site.heroImage)}">
          <img th:src="${site.heroImage}" th:alt="${site.title + ' 界面预览'}" loading="eager" fetchpriority="high" decoding="async">
        </figure>
        <aside class="product-overview" aria-label="产品概览" th:unless="${!#strings.isEmpty(site.heroImage)}">
          <div class="overview-head">
            <span class="overview-kicker">PRODUCT OVERVIEW / 产品概览</span>
            <span class="overview-os">WINDOWS</span>
          </div>
          <div class="overview-brand">
            <div class="product-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <div>
              <p class="overview-title" th:text="${site.title}">WinAppMigrator</p>
              <p class="overview-caption">迁移 · 优化 · AI 辅助操作</p>
            </div>
          </div>
          <nav class="overview-list" aria-label="了解产品能力">
            <a class="overview-item" href="#features" th:each="f, it : ${features}">
              <span class="overview-num" th:text="${#numbers.formatInteger(it.index + 1, 2)}">01</span>
              <strong th:text="${f.title}">产品功能</strong>
              <svg class="overview-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
            </a>
          </nav>
          <div class="overview-foot">
            <span><span id="consoleDownloads" th:text="${downloadsText}">0</span> 次累计下载</span>
            <a href="/download" th:text="${latest != null ? '查看 v' + latest.version : '查看下载信息'}">查看下载信息</a>
          </div>
        </aside>
      </div>
    </div>
    <div class="hero-bottom">
      <span>MIGRATE / OPTIMIZE / AUTOMATE</span>
      <a href="#features">向下了解产品<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5"/></svg></a>
    </div>
  </section>

  <!-- ==================== 功能特性 ==================== -->
  <div th:replace="~{fragments/blocks :: features(${features}, ${site.sections.features})}"></div>

  <!-- ==================== 界面实拍 ==================== -->
  <div th:replace="~{fragments/blocks :: gallery(${galleryPreview}, ${site.sections.gallery}, true)}"></div>

  <!-- ==================== 视频演示 ==================== -->
  <div th:replace="~{fragments/blocks :: videos(${videoPreview}, ${site.sections.videos}, true)}"></div>

  <!-- ==================== 数据一览 ==================== -->
  <div th:replace="~{fragments/blocks :: statsBlock(${site.stats}, ${site.sections.stats})}"></div>

  <!-- ==================== 产品优势 ==================== -->
  <div th:replace="~{fragments/blocks :: advantages(${site.advantages}, ${site.sections.advantages})}"></div>

  <!-- ==================== 常见问题 ==================== -->
  <div th:replace="~{fragments/blocks :: faq(${faqPreview}, ${site.sections.faq}, true)}"></div>
  <div class="wrap faq-more" th:if="${site.faq != null and site.faq.size() > 5}">
    <a class="btn btn-ghost" href="/faq">查看全部问题</a>
  </div>

  <!-- ==================== 更新日志 ==================== -->
  <div th:replace="~{fragments/blocks :: changelog(${latest}, ${site.sections.changelog})}"></div>

  <!-- ==================== 结尾行动区 ==================== -->
  <div th:replace="~{fragments/blocks :: ctaBand()}"></div>
</main>

<footer th:replace="~{fragments/blocks :: footer}"></footer>
<div th:replace="~{fragments/blocks :: overlays}"></div>
<div th:replace="~{fragments/blocks :: videoModal}"></div>

<nav class="mobile-bar" aria-label="快捷操作">
  <a class="mb-download" id="mobileDownload"
     th:href="${latest != null ? latest.url : '/download'}">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>
    </svg>
    <span>下载</span>
  </a>
  <a class="mb-feedback" href="/feedback">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <span>反馈</span>
  </a>
</nav>

<button class="back-top" id="backTop" type="button" aria-label="返回顶部" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
</button>

<script th:src="'/js/site.js?v=' + ${assetJs}" defer></script>
</body>
</html>
