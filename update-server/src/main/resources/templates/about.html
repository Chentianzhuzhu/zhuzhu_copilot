<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body th:attr="data-page=${pagePath}">

<a class="skip-link" href="#main">跳到主要内容</a>

<header th:replace="~{fragments/nav :: nav}"></header>

<main id="main">
  <div th:replace="~{fragments/blocks :: pageHero()}"></div>

  <!-- ==================== 联系方式 ==================== -->
  <section class="section" id="about-contacts" th:if="${site.about.contacts != null and !site.about.contacts.isEmpty()}">
    <div class="wrap">
      <div class="section-head sr">
        <p class="section-tag">// 联系方式</p>
        <h2 class="section-title">随时找到我们</h2>
        <p class="section-sub">以下方式均可联系到团队，我们会尽快回复。</p>
      </div>
      <div class="about-contacts-grid sr">
        <a class="contact-card" th:each="c : ${site.about.contacts}"
           th:href="${c.href}" th:attr="target=${c.href.startsWith('http') ? '_blank' : '_self'}, rel=${c.href.startsWith('http') ? 'noopener' : ''}">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/>
            </svg>
          </span>
          <span class="contact-label" th:text="${c.label}">邮箱</span>
          <span class="contact-value" th:text="${c.href}">admin@example.com</span>
        </a>
      </div>
    </div>
  </section>

  <!-- ==================== 团队成员 ==================== -->
  <section class="section" id="about-team" th:if="${site.about.members != null and !site.about.members.isEmpty()}">
    <div class="wrap">
      <div class="section-head sr">
        <p class="section-tag">// 团队成员</p>
        <h2 class="section-title">背后的人</h2>
        <p class="section-sub">每一位成员都在为产品体验全力以赴。</p>
      </div>
      <div class="about-team-grid sr">
        <article class="member-card" th:each="m : ${site.about.members}">
          <div class="member-avatar">
            <img th:if="${m.avatar != null and !#strings.isEmpty(m.avatar)}"
                 th:src="${m.avatar}" th:alt="${m.name}" loading="lazy" decoding="async">
            <span class="member-avatar-fallback" th:unless="${m.avatar != null and !#strings.isEmpty(m.avatar)}"
                  th:text="${#strings.substring(m.name, 0, 1)}">Z</span>
          </div>
          <h3 class="member-name" th:text="${m.name}">姓名</h3>
          <p class="member-role" th:text="${m.role}">角色</p>
        </article>
      </div>
    </div>
  </section>

  <div class="wrap" th:if="${(site.about.contacts == null or site.about.contacts.isEmpty()) and (site.about.members == null or site.about.members.isEmpty())}">
    <div class="empty-state sr">
      <p>关于我们页面内容待补充。</p>
      <p class="empty-hint">管理员可在后台「关于我们」中添加联系方式与团队成员信息。</p>
    </div>
  </div>

  <div th:replace="~{fragments/blocks :: ctaBand()}"></div>
</main>

<footer th:replace="~{fragments/blocks :: footer}"></footer>
<div th:replace="~{fragments/blocks :: overlays}"></div>
<div th:replace="~{fragments/blocks :: videoModal}"></div>

<button class="back-top" id="backTop" type="button" aria-label="返回顶部" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
</button>

<script th:src="'/js/site.js?v=' + ${assetJs}" defer></script>
</body>
</html>
