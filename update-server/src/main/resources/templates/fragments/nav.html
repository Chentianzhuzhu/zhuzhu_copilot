<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  顶部导航：桌面端横向菜单 + 移动端抽屉；当前页高亮与滚动监听锚点均由服务端下发
  菜单前的两位编号不是装饰：它把导航变成一份「章节索引」，与页面里的章节脊同构。
-->
<header class="nav" id="nav" th:fragment="nav">
  <div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.2" y="2.2" width="19.6" height="19.6" stroke="currentColor" stroke-width="1.4"/>
        <path d="M2.2 8.8h19.6M2.2 15.4h19.6" stroke="currentColor" stroke-width="1" opacity=".38"/>
        <rect x="5" y="4.9" width="5" height="2.6" fill="#1E40AF"/>
        <rect x="5" y="11.5" width="5" height="2.6" fill="currentColor" opacity=".5"/>
        <rect x="5" y="18.1" width="12" height="1.2" fill="currentColor" opacity=".5"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name" th:text="${site.title}">zhuzhu Copilot</span>
        <span class="brand-sub">WINDOWS AGENT</span>
      </span>
    </a>

    <nav class="menu" aria-label="主导航">
      <a th:each="n, it : ${navItems}"
         th:href="${n.href}"
         th:classappend="${n.active}"
         th:attr="data-spy=${n.spy}">
        <span class="menu-num" th:text="${#numbers.formatInteger(it.index + 1, 2)}">01</span>
        <span th:text="${n.label}">功能特性</span>
      </a>
    </nav>

    <div class="nav-right">
      <a class="nav-cta" id="navDownload"
         th:href="${latest != null ? latest.url : '/download'}">
        <span>下载</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>
        </svg>
      </a>
      <button class="nav-burger" id="navBurger" type="button"
              aria-label="打开导航菜单" aria-expanded="false" aria-controls="navDrawer">
        <span aria-hidden="true"></span><span aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="nav-drawer" id="navDrawer" hidden>
    <nav aria-label="移动端导航">
      <a th:each="n, it : ${navItems}"
         th:href="${n.href}"
         th:classappend="${n.active}">
        <span class="menu-num" th:text="${#numbers.formatInteger(it.index + 1, 2)}">01</span>
        <span th:text="${n.label}">功能特性</span>
      </a>
    </nav>
    <a class="drawer-download" id="drawerDownload"
       th:href="${latest != null ? latest.url : '/download'}">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 4v11m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>
      </svg>
      <span>下载</span>
    </a>
  </div>
</header>
</body>
</html>
