<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  SEO 头部：标题 / 描述 / 关键词 / 规范化链接 / Open Graph / Twitter Card / 结构化数据 / 站点图标 / 清单
  取值全部来自模型（由库内内容与请求推导），无硬编码域名
-->
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" th:attr="content=${site.style.themeColor} ?: '#000000'">
  <meta name="color-scheme" content="dark">

  <title th:text="${pageTitle}">WinAppMigrator</title>
  <meta name="description" th:attr="content=${pageDesc}">
  <meta name="keywords" th:if="${!#strings.isEmpty(keywords)}" th:attr="content=${keywords}">
  <meta name="author" th:attr="content=${site.title}">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <link rel="canonical" th:attr="href=${canonical}">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" th:attr="content=${site.title}">
  <meta property="og:title" th:attr="content=${pageTitle}">
  <meta property="og:description" th:attr="content=${pageDesc}">
  <meta property="og:url" th:attr="content=${canonical}">
  <meta property="og:image" th:attr="content=${ogImage}">
  <!--
    尺寸只在用品牌封面时声明：后台换了自定义分享图后尺寸未知，
    谎报宽高会让分享卡片被裁切。1200×630 是品牌封面本身的实际尺寸（静态回归校验会比对文件）。
  -->
  <meta th:if="${ogImageDefault}" property="og:image:width" content="1200">
  <meta th:if="${ogImageDefault}" property="og:image:height" content="630">
  <meta property="og:image:alt" th:attr="content=${pageTitle}">
  <meta property="og:locale" content="zh_CN">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" th:attr="content=${pageTitle}">
  <meta name="twitter:description" th:attr="content=${pageDesc}">
  <meta name="twitter:image" th:attr="content=${ogImage}">

  <!-- 站点图标与安装清单 -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="alternate" hreflang="zh-CN" th:attr="href=${canonical}">

  <!--
    样式与脚本带内容哈希版本号：资源内容一变 URL 就变，
    因此 CDN 与浏览器缓存不可能再把旧版 CSS/JS 与新页面混用。
    这里用绝对路径拼版本号（而非 @{} 链接表达式），与模板其余资源写法一致，
    也让模板能在非 Web 上下文中独立渲染（便于测试）。
  -->
  <link rel="preload" as="style" th:href="'/css/site.css?v=' + ${assetCss}">
  <link rel="stylesheet" th:href="'/css/site.css?v=' + ${assetCss}">

  <!--
    后台自定义视觉样式：主题色 / 背景色 / 文字色 / 圆角等 CSS 变量。
    取值来自库内内容 style 块（defaults 已兜底），未配置时使用下面的默认值。
  -->
  <style th:inline="css">
    :root {
      --theme-color: [[${site.style.themeColor} ?: '#4f8cff']];
      --theme-color-dark: [[${site.style.themeColorDark} ?: '#3a6fd4']];
      --accent-color: [[${site.style.accentColor} ?: '#00d4aa']];
      --bg-color: [[${site.style.bgColor} ?: '#0a0a0f']];
      --card-bg: [[${site.style.cardBgColor} ?: '#141420']];
      --text-color: [[${site.style.textColor} ?: '#e8e8f0']];
      --text-muted: [[${site.style.textMuted} ?: '#8888a0']];
      --corner-radius: [[${site.style.cornerRadius} ?: '12']]px;
    }
  </style>
  <!-- 后台注入的自定义 CSS 代码（原样输出） -->
  <style th:if="${site.style.customCss != null and !site.style.customCss.isEmpty()}" th:utext="${site.style.customCss}"></style>
  <!-- 自定义 favicon：后台配置后覆盖默认图标 -->
  <link rel="icon" th:if="${!#strings.isEmpty(site.style.faviconUrl)}" th:attr="href=${site.style.faviconUrl}">

  <!--
    标记 JS 可用：滚动揭示动画只在 JS 可用时才隐藏初始内容。
    site.js 若因 CDN 拦截、缓存错配或网络问题没能执行，3 秒后撤回该标记，
    让正文恢复可见 —— 内容可见性优先于装饰动画，绝不留下一屏空白。
  -->
  <script>
    document.documentElement.classList.add('js');
    setTimeout(function () {
      if (!window.__wmSiteReady) { document.documentElement.classList.remove('js'); }
    }, 3000);
  </script>

  <script type="application/ld+json" th:utext="${jsonLd}"></script>
</head>
</html>
