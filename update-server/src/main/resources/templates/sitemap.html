<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body th:attr="data-page=${pagePath}">

<a class="skip-link" href="#main">跳到主要内容</a>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div>
<div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

<header th:replace="~{fragments/nav :: nav}"></header>

<main id="main">
  <div th:replace="~{fragments/blocks :: pageHero()}"></div>

  <!-- 全站页面索引：标题已由 pageHero 输出，这里只出列表 -->
  <section class="section" id="all-pages">
    <div class="wrap">
      <nav class="sitemap-grid sr" id="sitemapGrid" aria-label="全站页面">
        <a class="sitemap-card" th:each="p, it : ${sitePages}" th:href="${p.path}"
           th:attr="aria-label=${'前往' + p.label}">
          <span class="sitemap-index" th:text="${#numbers.formatInteger(it.index + 1, 2)}">01</span>
          <span class="sitemap-label" th:text="${p.label}">首页</span>
          <span class="sitemap-path" th:text="${p.path}">/</span>
          <span class="sitemap-desc" th:text="${p.desc}">页面说明</span>
          <span class="sitemap-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14m0 0-6-6m6 6-6 6"/>
            </svg>
          </span>
        </a>
      </nav>

      <div class="sitemap-foot sr">
        <p class="sitemap-note">
          供搜索引擎抓取的 XML 版本：<a href="/sitemap.xml">/sitemap.xml</a>
        </p>
        <div class="sitemap-actions">
          <a class="btn btn-ghost" href="/download">下载安装</a>
          <a class="btn btn-ghost" href="/about">联系我们</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer th:replace="~{fragments/blocks :: footer}"></footer>
<div th:replace="~{fragments/blocks :: videoModal}"></div>

<button class="back-top" id="backTop" type="button" aria-label="返回顶部" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
</button>

<script th:src="'/js/site.js?v=' + ${assetJs}" defer></script>
</body>
</html>
