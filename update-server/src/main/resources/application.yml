server:
  port: 8080
  # 只监听本机：官网经 nginx 反代访问，管理后台经 SSH 隧道访问
  address: 127.0.0.1

spring:
  application:
    name: update-server
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:winapp_update}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB
  jackson:
    time-zone: Asia/Shanghai

# 管理后台登录密码：必须通过环境变量 ADMIN_PASSWORD 提供，禁止明文入库
admin:
  password: ${ADMIN_PASSWORD:}

# 官网绝对地址（用于 canonical / sitemap / 结构化数据）
# 留空则按反向代理透传的 X-Forwarded-Proto / X-Forwarded-Host 自动推导；
# 若前置了 CDN 或域名有变，建议显式设置，例如 https://example.com
site:
  base-url: ${SITE_BASE_URL:}

# 上传目录（安装包 + 官网图片 + 官网视频）
upload:
  dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    root: info
