# WinAppMigrator 更新服务器 nginx 配置（HTTPS + 域名）
# 复制到 /etc/nginx/conf.d/update.conf，替换 example.com 与证书路径后 nginx -t && nginx -s reload
# 注意：管理后台 /admin 未对外放行，只能通过 SSH 隧道访问 127.0.0.1:8080

server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 官网图片/安装包上传体积较大
    client_max_body_size 600m;

    # 管理后台禁止对外暴露：外网一律 404，仅可通过 SSH 隧道访问 127.0.0.1:8080/admin
    location /admin {
        return 404;
    }

    # 旧静态官网已下线，301 归并到本站根路径。
    # 原因：该静态站的源文件已从仓库移除（需要时用 git show 30f582d:website/index.html 取回），
    # 而它的 canonical / hreflang / og:url 与 JSON-LD（SoftwareApplication.url、WebSite.url）
    # 都把 https://<域名>/website/ 声明成**正式官网** —— 与本站（Spring 服务端渲染，canonical
    # 取自 SITE_BASE_URL）构成两个「官方站」，搜索引擎会判为重复站点、权重被分散。
    # 归并后本站是唯一官网入口；服务器上 /var/www/website/ 的旧文件已无人引用，可自行删除。
    # 注意不要用 try_files 兜底，单页站会给任意路径返回 200（soft-404）。
    location /website/ {
        return 301 $scheme://$host/;
    }

    # 官网 + 公开 API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 安装包下载：关闭缓冲直接透传，避免占用 nginx 内存
    location /api/update/download/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 上传资源（安装包不在官网直接引用，此段主要为官网图片）
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
    }
}
